intro:
  id: intro
  number: "01"
  label: 들어가며
  name: Jung Jiwoong
  statement: 무엇을 하든 결국에는 해낼 것이다
  lead: AI가 더 효율적으로 작동하는 방법에 관심을 두고, 유학생을 돕기 위한 팀 플랫폼 KONNECT에서 백엔드를 맡고 있습니다.
  jump_label: 이어서 보기
  figure:
    title: 하나의 점으로 모이는 여러 갈래의 길
    desc: 위에서 출발한 다섯 갈래의 길이 굽이치고, 몇몇 길은 막다른 곳에서 멈추지만 결국 모두 아래의 한 점에서 만납니다. ‘무엇을 하든 결국에는 해낼 것이다’라는 문장을 그림으로 옮겼습니다.

about:
  id: about
  number: "02"
  title: 그는 누구인가
  interest:
    kicker: 관심
    title: AI의 효율적인 작동
    body: AI가 느려지거나 병목에 걸리는 상황을 직접 겪으며 불편함을 느꼈습니다. 그 경험이 AI가 효율적으로 작동하는 방식에 관심을 갖게 된 계기입니다.
  figure:
    title: 한 지점에서 좁아지는 흐름
    desc: 왼쪽의 여러 지점에서 출발한 선이 가운데의 좁은 관문으로 모이고, 관문 앞에는 차례를 기다리는 점들이 쌓여 있습니다. 관문을 지난 흐름은 오른쪽에서 다시 갈라집니다. AI가 병목에 걸리는 상황을 표현한 추상 네트워크 그림입니다.
  tools:
    title: 사용해 본 도구
    body: 웹사이트 제작과 학교 과제에서 사용했습니다.
    items:
      - React
      - Firebase
      - GitHub
      - C++
      - C

future:
  id: future
  number: "03"
  title: 바라보고 있는 미래
  body: AI를 효율적으로 운용하려면 데이터베이스, 전력, 반도체에 대한 이해가 필요하다고 생각합니다. 그래서 앞으로 이 세 분야를 공부하려고 합니다.
  areas_label: 공부하려는 분야
  areas:
    - 데이터베이스
    - 전력
    - 반도체
  figure:
    title: 현재 지점에서 세 방향으로 뻗는 길
    desc: 위쪽의 현재 지점에서 내려온 길이 세 갈래로 나뉘어 데이터베이스, 전력, 반도체를 향합니다. 각 길의 끝은 아직 비어 있는 원으로 남아 있습니다.

current:
  id: current
  number: "04"
  title: 현재의 모습
  kicker: 대표 활동
  project: KONNECT
  summary: 유학생을 돕기 위한 팀 플랫폼
  facts:
    - term: 역할
      desc: 팀에서 백엔드를 맡고 있습니다.
    - term: 시기
      desc: 2026년 초에 시작했고, 2학기 인수인계 이후 본격적으로 참여하고 있습니다.
    - term: 상태
      desc: 진행 중입니다. 아직 공개된 중간 결과물은 없습니다.
      status: true
  process:
    title: 진행 방식
    steps:
      - 프론트엔드에서 기능의 틀을 먼저 만듭니다.
      - 그 틀에 백엔드를 연결합니다.
      - 로그와 실제 동작을 비교하며 문제를 확인합니다.
      - AI의 제안은 직접 확인합니다.
    note: 제작에는 Codex를, 검토에는 Claude를 사용합니다.
  learning:
    title: 배운 점
    items:
      - AI의 제안을 직접 확인하면서 공부해야 한다는 것을 배웠습니다.
      - 모든 것을 완벽하게 해결하려는 태도는 조금씩 조정해 나가고 싶습니다.
  figure:
    title: 화면의 틀과 백엔드, 그리고 로그와 실제 동작의 비교
    desc: 왼쪽 위의 화면 틀과 오른쪽 위의 백엔드가 하나의 선으로 연결되어 있습니다. 아래에는 로그를 나타내는 계단 모양의 선과 실제 동작을 나타내는 곡선이 나란히 놓여 있고, 두 선을 비교하는 지점이 원으로 표시되어 있습니다.
