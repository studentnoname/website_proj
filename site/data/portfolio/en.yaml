intro:
  id: intro
  number: "01"
  label: Introduction
  name: Jung Jiwoong
  statement: Whatever I take on, I will see it through in the end.
  original: 무엇을 하든 결국에는 해낼 것이다
  original_label: Original Korean
  lead: I am interested in how AI can run more efficiently, and I am responsible for the backend of KONNECT, a team platform meant to help international students.
  jump_label: Continue reading
  figure:
    title: Many paths meeting at a single point
    desc: Five paths set out from the top and wind downward. Some stop at dead ends, yet all of them finally meet at one point at the bottom. A drawing of the line “Whatever I take on, I will see it through in the end.”

about:
  id: about
  number: "02"
  title: Who He Is
  interest:
    kicker: Interest
    title: Efficient AI
    body: I have run into AI slowing down and getting stuck at bottlenecks, and found it frustrating. That experience is what drew me to how AI can work efficiently.
  figure:
    title: A flow that narrows at one point
    desc: Lines from several points on the left converge on a narrow gate in the middle, with dots piling up as they wait in front of it. Past the gate, the flow branches out again on the right. An abstract network drawing of AI hitting a bottleneck.
  tools:
    title: Tools I have used
    body: Used for building websites and for coursework.
    items:
      - React
      - Firebase
      - GitHub
      - C++
      - C

future:
  id: future
  number: "03"
  title: The Future in View
  body: I believe that understanding databases, power and semiconductors matters for running AI efficiently, so these are the three fields I plan to study.
  areas_label: Fields I plan to study
  areas:
    - Databases
    - Power
    - Semiconductors
  figure:
    title: Paths reaching out in three directions from where I stand
    desc: A path comes down from the current point at the top and splits three ways, toward databases, power and semiconductors. The end of each path is still an open circle.

current:
  id: current
  number: "04"
  title: Where He Is Now
  kicker: Main activity
  project: KONNECT
  summary: A team platform meant to help international students
  facts:
    - term: Role
      desc: I am responsible for the backend on the team.
    - term: Period
      desc: Started in early 2026; working on it in earnest since the second-semester handover.
    - term: Status
      desc: Ongoing. No intermediate results have been made public yet.
      status: true
  process:
    title: How the work proceeds
    steps:
      - The frontend first builds the functional framework.
      - The backend is then connected to that framework.
      - Logs are compared with actual behavior to identify problems.
      - AI suggestions are checked directly.
    note: Codex is used for building and Claude for review.
  learning:
    title: What I have learned
    items:
      - I need to study by checking AI suggestions myself.
      - I want to gradually ease off the urge to solve everything perfectly.
  figure:
    title: The interface frame, the backend, and logs compared with actual behavior
    desc: An interface frame at the upper left and a backend at the upper right are joined by a single line. Below them, a stepped line standing for the logs and a curved line standing for actual behavior run side by side, and a ring marks the point where the two are being compared.
