# Languages
#   Documentation: https://docs.hugoblox.com/reference/language/
#   Korean is the default language and is served from the site root.
#   English is served from /en/. Each language has its own content folder.
#   Menus are defined per language in menus.ko.yaml and menus.en.yaml.

ko:
  locale: ko-KR
  weight: 1
  contentDir: content/ko
  title: Jung Jiwoong

en:
  locale: en-US
  weight: 2
  contentDir: content/en
  title: Jung Jiwoong
