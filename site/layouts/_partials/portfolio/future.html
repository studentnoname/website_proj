{{- $s := .d.future -}}
{{- $fig := $s.figure -}}
<section id="{{ $s.id }}" class="pf-section pf-future" aria-labelledby="{{ $s.id }}-title" data-pf-section>
  <div class="pf-wrap">
    <header class="pf-sec-head">
      <span class="pf-sec-num" aria-hidden="true">{{ $s.number }}</span>
      <h2 id="{{ $s.id }}-title" class="pf-sec-title">{{ $s.title }}</h2>
    </header>

    <p class="pf-future__body">{{ $s.body }}</p>

    <figure class="pf-figure pf-future__figure">
      <svg class="pf-svg" viewBox="0 0 1200 300" role="img" focusable="false"
           aria-labelledby="pf-fig-future-t pf-fig-future-d" xmlns="http://www.w3.org/2000/svg">
        <title id="pf-fig-future-t">{{ $fig.title }}</title>
        <desc id="pf-fig-future-d">{{ $fig.desc }}</desc>
        <g class="pf-svg__grid">
          <line x1="200" y1="0" x2="200" y2="300" />
          <line x1="600" y1="0" x2="600" y2="300" />
          <line x1="1000" y1="0" x2="1000" y2="300" />
          <line x1="0" y1="272" x2="1200" y2="272" />
        </g>
        <g class="pf-svg__ln">
          <path d="M600 34 V112" />
          <path d="M600 112 C600 176 200 150 200 214" />
          <path d="M600 112 V214" />
          <path d="M600 112 C600 176 1000 150 1000 214" />
        </g>
        <path class="pf-flow" d="M600 34 V112 C600 176 200 150 200 214" />
        <path class="pf-flow pf-flow--late" d="M600 34 V214" />
        <path class="pf-flow pf-flow--slow" d="M600 34 V112 C600 176 1000 150 1000 214" />
        <g class="pf-svg__dim">
          <path d="M200 214 V258" />
          <path d="M600 214 V258" />
          <path d="M1000 214 V258" />
        </g>
        <g class="pf-svg__open">
          <circle cx="200" cy="272" r="12" />
          <circle cx="600" cy="272" r="12" />
          <circle cx="1000" cy="272" r="12" />
        </g>
        <circle class="pf-svg__ring" cx="600" cy="34" r="20" />
        <circle class="pf-svg__dot" cx="600" cy="34" r="8" />
      </svg>
    </figure>

    <h3 class="pf-kicker pf-future__label">{{ $s.areas_label }}</h3>
    <ol class="pf-areas">
      {{- range $i, $area := $s.areas }}
      <li class="pf-areas__item">
        <span class="pf-areas__num" aria-hidden="true">{{ $s.number }}.{{ add $i 1 }}</span>
        <span class="pf-areas__name">{{ $area }}</span>
      </li>
      {{- end }}
    </ol>
  </div>
</section>
